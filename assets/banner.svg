<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1F2A"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="85%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="16" fill="url(#glowBlue)"/>
  <rect width="1200" height="340" rx="16" fill="url(#glowGreen)"/>
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Grid Accent on Right -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.45">
    <line x1="760" y1="0" x2="760" y2="340"/>
    <line x1="840" y1="0" x2="840" y2="340"/>
    <line x1="920" y1="0" x2="920" y2="340"/>
    <line x1="1000" y1="0" x2="1000" y2="340"/>
    <line x1="1080" y1="0" x2="1080" y2="340"/>
    <line x1="1160" y1="0" x2="1160" y2="340"/>
    <line x1="720" y1="70" x2="1200" y2="70"/>
    <line x1="720" y1="140" x2="1200" y2="140"/>
    <line x1="720" y1="210" x2="1200" y2="210"/>
    <line x1="720" y1="280" x2="1200" y2="280"/>
  </g>

  <!-- High-Legibility Code/Architecture Card on Right -->
  <g transform="translate(800, 52)">
    <rect width="348" height="236" rx="12" fill="#0B1120" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="5" fill="#EF4444"/>
    <circle cx="38" cy="22" r="5" fill="#F59E0B"/>
    <circle cx="54" cy="22" r="5" fill="#10B981"/>
    <text x="74" y="27" fill="#94A3B8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" font-weight="600">developer.ts</text>
    <line x1="0" y1="42" x2="348" y2="42" stroke="#1E293B" stroke-width="1.5"/>
    
    <text x="22" y="78" fill="#E2E8F0" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="15" font-weight="600">
      <tspan fill="#38BDF8">const</tspan> role = <tspan fill="#10B981">"Software Developer"</tspan>;
    </text>
    
    <text x="22" y="112" fill="#E2E8F0" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="15" font-weight="600">
      <tspan fill="#38BDF8">const</tspan> stack = [
    </text>
    <text x="44" y="140" fill="#F8FAFC" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="14.5" font-weight="500">
      <tspan fill="#38BDF8">"Java"</tspan>, <tspan fill="#10B981">"Kotlin"</tspan>, <tspan fill="#38BDF8">"React"</tspan>, <tspan fill="#F59E0B">"Python"</tspan>
    </text>
    <text x="22" y="168" fill="#E2E8F0" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="15" font-weight="600">];</text>

    <!-- High-Legibility Status Pill -->
    <rect x="22" y="188" width="304" height="32" rx="8" fill="#064E3B" fill-opacity="0.55" stroke="#059669" stroke-width="1.2"/>
    <circle cx="38" cy="204" r="5" fill="#34D399"/>
    <text x="52" y="209" fill="#A7F3D0" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" font-weight="700">Open to Full-Stack &amp; Software Roles</text>
  </g>

  <!-- Left Content -->
  <text x="64" y="66" fill="#10B981" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">
    PORTFÓLIO DE ENGENHARIA DE SOFTWARE
  </text>

  <text x="64" y="128" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">
    Igor Hagge
  </text>

  <text x="64" y="168" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500">
    Software Developer | Full-Stack • Mobile • IA Aplicada
  </text>

  <text x="64" y="202" fill="#38BDF8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    Java  •  Spring Boot  •  Kotlin  •  React  •  TypeScript  •  Python
  </text>

  <!-- Accent Divider -->
  <rect x="64" y="222" width="670" height="3" rx="1.5" fill="url(#accentLine)"/>

  <!-- Feature Pills Requested by User -->
  <g transform="translate(64, 246)">
    <!-- 1. Full Stack -->
    <rect x="0" y="0" width="124" height="36" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="62" y="23" text-anchor="middle" fill="#E0F2FE" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">Full Stack</text>

    <!-- 2. Mobile -->
    <rect x="138" y="0" width="108" height="36" rx="18" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="192" y="23" text-anchor="middle" fill="#D1FAE5" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">Mobile</text>

    <!-- 3. IA Aplicada -->
    <rect x="260" y="0" width="144" height="36" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="332" y="23" text-anchor="middle" fill="#E0F2FE" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">IA Aplicada</text>

    <!-- 4. Software Engineering -->
    <rect x="418" y="0" width="206" height="36" rx="18" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="521" y="23" text-anchor="middle" fill="#D1FAE5" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">Software Engineering</text>
  </g>
</svg>