<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1F2A"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="85%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="16" fill="url(#glowBlue)"/>
  <rect width="1200" height="340" rx="16" fill="url(#glowGreen)"/>
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Grid Accent on Right -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.45">
    <line x1="780" y1="0" x2="780" y2="340"/>
    <line x1="860" y1="0" x2="860" y2="340"/>
    <line x1="940" y1="0" x2="940" y2="340"/>
    <line x1="1020" y1="0" x2="1020" y2="340"/>
    <line x1="1100" y1="0" x2="1100" y2="340"/>
    <line x1="720" y1="70" x2="1200" y2="70"/>
    <line x1="720" y1="140" x2="1200" y2="140"/>
    <line x1="720" y1="210" x2="1200" y2="210"/>
    <line x1="720" y1="280" x2="1200" y2="280"/>
  </g>

  <!-- Decorative Code/Architecture Card on Right -->
  <g transform="translate(810, 62)">
    <rect width="320" height="216" rx="12" fill="#0B1120" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="5" fill="#EF4444"/>
    <circle cx="38" cy="22" r="5" fill="#F59E0B"/>
    <circle cx="54" cy="22" r="5" fill="#10B981"/>
    <text x="74" y="26" fill="#64748B" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12">portfolio.yml</text>
    <line x1="0" y1="40" x2="320" y2="40" stroke="#1E293B" stroke-width="1"/>
    <text x="22" y="70" fill="#38BDF8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">developer:</text>
    <text x="110" y="70" fill="#E2E8F0" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">"Igor Hagge"</text>
    <text x="22" y="96" fill="#38BDF8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">backend:</text>
    <text x="98" y="96" fill="#10B981" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">[Java 21, Spring Boot 3]</text>
    <text x="22" y="122" fill="#38BDF8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">mobile:</text>
    <text x="88" y="122" fill="#10B981" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">[Kotlin, React Native]</text>
    <text x="22" y="148" fill="#38BDF8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">database:</text>
    <text x="104" y="148" fill="#E2E8F0" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">[PostgreSQL, SQLite]</text>
    <text x="22" y="174" fill="#38BDF8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">focus:</text>
    <text x="78" y="174" fill="#94A3B8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">"Clean APIs &amp; Offline-First"</text>
    <text x="22" y="200" fill="#10B981" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12">● Ready for new opportunities</text>
  </g>

  <!-- Left Content -->
  <text x="64" y="68" fill="#10B981" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">
    PORTFÓLIO DE DESENVOLVIMENTO
  </text>

  <text x="64" y="132" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">
    Igor Hagge
  </text>

  <text x="64" y="172" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500">
    Software Developer
  </text>

  <text x="64" y="206" fill="#38BDF8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    Java  •  Spring Boot  •  Kotlin  •  React Native
  </text>

  <!-- Accent Divider -->
  <rect x="64" y="226" width="460" height="3" rx="1.5" fill="url(#accentLine)"/>

