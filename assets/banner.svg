  <g transform="translate(64, 250)">
    <rect x="0" y="0" width="110" height="36" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="55" y="23" text-anchor="middle" fill="#E0F2FE" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">Backend</text>

    <rect x="124" y="0" width="104" height="36" rx="18" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="176" y="23" text-anchor="middle" fill="#D1FAE5" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">Mobile</text>

    <rect x="242" y="0" width="116" height="36" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="300" y="23" text-anchor="middle" fill="#E0F2FE" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">APIs REST</text>

    <rect x="372" y="0" width="140" height="36" rx="18" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="442" y="23" text-anchor="middle" fill="#D1FAE5" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">Offline-First &amp; IA</text>
  </g>
